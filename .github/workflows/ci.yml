name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - run: forge test -vv
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-check the committed vectors with both Python implementations
        run: |
          pip install hsslms==0.1.3
          python3 scripts/check_vectors.py
      - name: The RFC 8554 test cases in the vectors are the RFC's own
        run: |
          curl -sfL https://www.rfc-editor.org/rfc/rfc8554.txt -o /tmp/rfc8554.txt
          python3 scripts/check_rfc_cases.py /tmp/rfc8554.txt

  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Halmos 0.3.3 (with the SHA-256 model fix)
        run: |
          pip install halmos==0.3.3
          SEVM="$(python -c 'import halmos, os; print(os.path.join(os.path.dirname(halmos.__file__), "sevm.py"))')"
          # Halmos 0.3.3 sizes the SHA-256 input in bytes where bits are required.
          sed -i 's/f"f_sha256_{arg_size}", BitVecSorts\[arg_size\], BitVecSort256/f"f_sha256_{arg_size}", BitVecSorts[arg_size * 8], BitVecSort256/' "$SEVM"
          grep -q 'BitVecSorts\[arg_size \* 8\], BitVecSort256' "$SEVM"
      - name: Prove src/LMS.sol equivalent to RFC 8554, step by step
        # --loop must exceed p = 265 (LMOTS_SHA256_N32_W1), the longest loop the lemmas unroll.
        run: halmos --match-contract LMSEquivalence --loop 300 --solver-timeout-assertion 0 2>&1 | tee halmos.log
      - name: Reject a truncated or vacuous proof run
        run: python3 scripts/check_proof_run.py 300 halmos.log
